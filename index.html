<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Construction Lead Search</title>
  <meta name="description" content="건설/건축 리드 탐색 데이터베이스">
  <style>
    :root { color-scheme: light; --ink:#17202a; --muted:#667085; --line:#d7dde5; --bg:#f6f8fb; --panel:#fff; --accent:#1463ff; --accent2:#0f8b6f; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Arial, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color:var(--ink); background:var(--bg); }
    header { background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:2; }
    .shell { width:min(1180px, calc(100% - 32px)); margin:0 auto; }
    .top { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:14px 0; }
    .brand { display:flex; align-items:center; gap:10px; font-weight:800; }
    .mark { width:34px; height:34px; display:grid; place-items:center; border-radius:7px; background:var(--accent); color:#fff; }
    main { padding:28px 0 56px; }
    h1 { margin:0; font-size:28px; line-height:1.25; }
    p { margin:0; color:var(--muted); }
    .hero { display:grid; grid-template-columns: 1fr; gap:18px; margin-bottom:18px; }
    .stats { display:grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap:10px; }
    .stat, .panel, .result { background:var(--panel); border:1px solid var(--line); border-radius:8px; }
    .stat { padding:14px; }
    .stat span { display:block; color:var(--muted); font-size:13px; }
    .stat strong { font-size:24px; }
    .panel { padding:14px; margin-bottom:14px; }
    .controls { display:grid; grid-template-columns: minmax(240px, 1fr) 170px 210px 130px; gap:10px; }
    input, select, button { width:100%; height:42px; border:1px solid var(--line); border-radius:7px; background:#fff; color:var(--ink); font:inherit; padding:0 12px; }
    button { cursor:pointer; border-color:var(--accent); background:var(--accent); color:#fff; font-weight:700; }
    .meta { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:14px 0; color:var(--muted); font-size:14px; }
    .results { display:grid; gap:10px; }
    .result { padding:14px; display:grid; grid-template-columns: 1fr auto; gap:12px; }
    .result h2 { margin:0 0 6px; font-size:18px; }
    .tags { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
    .tag { border:1px solid var(--line); border-radius:999px; padding:4px 8px; color:var(--muted); font-size:12px; background:#f9fafb; }
    .links { display:flex; flex-direction:column; gap:8px; min-width:130px; }
    a.btn { text-decoration:none; text-align:center; border:1px solid var(--accent); border-radius:7px; padding:9px 10px; color:#fff; background:var(--accent); font-weight:700; }
    a.btn.secondary { color:var(--accent); background:#fff; }
    button.link-btn { height:auto; text-align:center; border:1px solid var(--accent2); border-radius:7px; padding:9px 10px; color:#fff; background:var(--accent2); font-weight:700; }
    .pager { display:flex; justify-content:center; gap:8px; margin-top:18px; }
    .pager button { width:auto; min-width:92px; }
    .empty { padding:28px; text-align:center; color:var(--muted); }
    .detail-overlay { position:fixed; inset:0; z-index:5; background:rgba(23,32,42,.45); padding:28px 16px; overflow:auto; }
    .detail-overlay[hidden] { display:none; }
    .detail-panel { width:min(780px, 100%); margin:0 auto; background:#fff; border:1px solid var(--line); border-radius:8px; box-shadow:0 20px 60px rgba(16,24,40,.22); }
    .detail-head { display:flex; justify-content:space-between; gap:14px; align-items:flex-start; padding:18px; border-bottom:1px solid var(--line); }
    .detail-head h2 { margin:0 0 6px; font-size:22px; }
    .detail-close { width:42px; min-width:42px; padding:0; background:#fff; color:var(--ink); border-color:var(--line); }
    .detail-body { padding:18px; display:grid; gap:14px; }
    .detail-grid { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:10px; }
    .detail-item { border:1px solid var(--line); border-radius:8px; padding:12px; background:#fbfcfe; }
    .detail-item span { display:block; color:var(--muted); font-size:12px; margin-bottom:5px; }
    .detail-item strong, .detail-item a { overflow-wrap:anywhere; }
    .detail-actions { display:flex; flex-wrap:wrap; gap:8px; }
    .detail-actions a { text-decoration:none; border:1px solid var(--accent); border-radius:7px; padding:9px 10px; color:#fff; background:var(--accent); font-weight:700; }
    .detail-actions a.secondary { color:var(--accent); background:#fff; }
    .source-box { white-space:pre-wrap; overflow-wrap:anywhere; color:var(--muted); }
    @media (max-width: 820px) { .stats, .controls, .result, .detail-grid { grid-template-columns:1fr; } .links { flex-direction:row; flex-wrap:wrap; } .top { align-items:flex-start; flex-direction:column; } }
  </style>
</head>
<body>
  <header><div class="shell top"><div class="brand"><div class="mark">CL</div><div>Construction Lead<br><small>lead.industry.ai.kr</small></div></div><p id="generated"></p></div></header>
  <main class="shell">
    <section class="hero">
      <div><h1>건설/건축 리드 탐색</h1><p>회사명, 지역, 주소, 홈페이지, 연락처를 빠르게 필터링합니다.</p></div>
      <div class="stats"><div class="stat"><span>전체 리드</span><strong id="totalCount">-</strong></div><div class="stat"><span>검색 결과</span><strong id="resultCount">-</strong></div><div class="stat"><span>지역</span><strong id="regionCount">-</strong></div><div class="stat"><span>분류</span><strong id="segmentCount">-</strong></div></div>
    </section>
    <section class="panel">
      <div class="controls">
        <input id="q" type="search" placeholder="회사명, 주소, 이메일, 도메인 검색" autocomplete="off">
        <select id="region"><option value="">전체 지역</option></select>
        <select id="segment"><option value="">전체 분류</option></select>
        <button id="reset">초기화</button>
      </div>
    </section>
    <div class="meta"><span id="status">데이터 로딩 중</span><span>페이지당 24개</span></div>
    <section id="results" class="results"></section>
    <div class="pager"><button id="prev">이전</button><button id="next">다음</button></div>
  </main>
  <div id="detailOverlay" class="detail-overlay" hidden>
    <article class="detail-panel" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
      <div class="detail-head">
        <div>
          <h2 id="detailTitle"></h2>
          <p id="detailSubtitle"></p>
        </div>
        <button id="detailClose" class="detail-close" type="button" aria-label="닫기">×</button>
      </div>
      <div class="detail-body">
        <div class="detail-actions" id="detailActions"></div>
        <div class="detail-grid" id="detailGrid"></div>
        <div class="detail-item">
          <span>출처</span>
          <strong id="detailSource" class="source-box"></strong>
        </div>
      </div>
    </article>
  </div>
  <script>
    const pageSize = 24;
    let all = [];
    let filtered = [];
    let page = 1;
    const el = id => document.getElementById(id);
    const fmt = n => Number(n || 0).toLocaleString('ko-KR');
    const norm = v => String(v || '').toLowerCase().replace(/\s+/g, ' ').trim();
    function option(select, value) { const o = document.createElement('option'); o.value = value; o.textContent = value; select.appendChild(o); }
    function apply() {
      const q = norm(el('q').value);
      const region = el('region').value;
      const segment = el('segment').value;
      filtered = all.filter(item => {
        if (region && item.region !== region) return false;
        if (segment && item.segment !== segment) return false;
        if (!q) return true;
        return norm([item.name,item.segment,item.region,item.address,item.homepage,item.phone,item.email,item.source].join(' ')).includes(q);
      });
      page = 1;
      render();
    }
    function render() {
      const start = (page - 1) * pageSize;
      const items = filtered.slice(start, start + pageSize);
      el('resultCount').textContent = fmt(filtered.length);
      el('status').textContent = filtered.length ? `${fmt(filtered.length)}개 중 ${fmt(start + 1)}-${fmt(Math.min(start + items.length, filtered.length))} 표시` : '검색 결과 없음';
      const results = el('results');
      results.innerHTML = '';
      if (!items.length) { results.innerHTML = '<div class="empty panel">검색 결과가 없습니다.</div>'; return; }
      for (const item of items) {
        const card = document.createElement('article');
        card.className = 'result';
        const detail = `<button class="link-btn" type="button" data-detail-id="${item.id}">상세보기</button>`;
        const homepage = item.homepage ? `<a class="btn" href="${escapeHtml(item.homepage)}" target="_blank" rel="noopener">홈페이지</a>` : '';
        const contact = item.contact ? `<a class="btn secondary" href="${escapeHtml(item.contact)}" target="_blank" rel="noopener">문의 페이지</a>` : '';
        card.innerHTML = `<div><h2>${escapeHtml(item.name)}</h2><p>${escapeHtml(item.address || '주소 정보 없음')}</p><div class="tags">${tag(item.region || '전국')}${tag(item.segment || '미분류')}${tag(item.confidence || 'confidence n/a')}${item.phone ? tag(item.phone) : ''}${item.email ? tag(item.email) : ''}</div></div><div class="links">${detail}${homepage}${contact}</div>`;
        results.appendChild(card);
        card.querySelector('[data-detail-id]').addEventListener('click', () => showDetail(item.id));
      }
      el('prev').disabled = page <= 1;
      el('next').disabled = start + pageSize >= filtered.length;
    }
    function tag(value) { return `<span class="tag">${escapeHtml(value)}</span>`; }
    function escapeHtml(value) { return String(value || '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
    function detailItem(label, value, href) {
      const safeValue = escapeHtml(value || '정보 없음');
      const content = href ? `<a href="${escapeHtml(href)}" target="_blank" rel="noopener">${safeValue}</a>` : `<strong>${safeValue}</strong>`;
      return `<div class="detail-item"><span>${escapeHtml(label)}</span>${content}</div>`;
    }
    function showDetail(id) {
      const item = all.find(candidate => String(candidate.id) === String(id));
      if (!item) return;
      el('detailTitle').textContent = item.name;
      el('detailSubtitle').textContent = [item.segment || '미분류', item.region || '전국'].join(' · ');
      el('detailActions').innerHTML = [
        item.homepage ? `<a href="${escapeHtml(item.homepage)}" target="_blank" rel="noopener">홈페이지 열기</a>` : '',
        item.contact ? `<a class="secondary" href="${escapeHtml(item.contact)}" target="_blank" rel="noopener">문의 페이지</a>` : '',
        item.email ? `<a class="secondary" href="mailto:${escapeHtml(item.email)}">이메일</a>` : ''
      ].filter(Boolean).join('');
      el('detailGrid').innerHTML = [
        detailItem('지역', item.region),
        detailItem('분류', item.segment),
        detailItem('주소', item.address),
        detailItem('전화', item.phone),
        detailItem('이메일', item.email, item.email ? `mailto:${item.email}` : ''),
        detailItem('신뢰도', item.confidence),
        detailItem('홈페이지', item.homepage, item.homepage),
        detailItem('문의 페이지', item.contact, item.contact)
      ].join('');
      el('detailSource').textContent = item.source || '정보 없음';
      el('detailOverlay').hidden = false;
      if (location.hash !== `#lead-${item.id}`) history.replaceState(null, '', `#lead-${item.id}`);
    }
    function closeDetail() {
      el('detailOverlay').hidden = true;
      if (location.hash.startsWith('#lead-')) history.replaceState(null, '', location.pathname + location.search);
    }
    function openHashDetail() {
      const match = location.hash.match(/^#lead-(\d+)$/);
      if (match) showDetail(match[1]);
    }
    fetch('data.json').then(r => r.json()).then(payload => {
      all = payload.items || [];
      filtered = all.slice();
      el('totalCount').textContent = fmt(payload.summary.total);
      el('regionCount').textContent = fmt(payload.summary.regions.length);
      el('segmentCount').textContent = fmt(payload.summary.segments.length);
      el('generated').textContent = `updated ${payload.summary.generated}`;
      payload.summary.regions.forEach(v => option(el('region'), v));
      payload.summary.segments.forEach(v => option(el('segment'), v));
      render();
      openHashDetail();
    });
    el('q').addEventListener('input', apply);
    el('region').addEventListener('change', apply);
    el('segment').addEventListener('change', apply);
    el('reset').addEventListener('click', () => { el('q').value=''; el('region').value=''; el('segment').value=''; apply(); });
    el('prev').addEventListener('click', () => { if (page > 1) { page--; render(); scrollTo(0,0); } });
    el('next').addEventListener('click', () => { if (page * pageSize < filtered.length) { page++; render(); scrollTo(0,0); } });
    el('detailClose').addEventListener('click', closeDetail);
    el('detailOverlay').addEventListener('click', event => { if (event.target === el('detailOverlay')) closeDetail(); });
    addEventListener('keydown', event => { if (event.key === 'Escape' && !el('detailOverlay').hidden) closeDetail(); });
    addEventListener('hashchange', openHashDetail);
  </script>
</body>
</html>
