<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Industry Lead Search</title>
  <meta name="description" content="산업별 B2B 리드 검색 데이터베이스">
  <script>
    if (location.protocol === "http:" && !["localhost", "127.0.0.1"].includes(location.hostname)) {
      location.replace(`https://${location.host}${location.pathname}${location.search}${location.hash}`);
    }
  </script>
  <style>
    :root {
      color-scheme: light;
      --ink: #132033;
      --muted: #627083;
      --line: #d7dee8;
      --bg: #f5f7fb;
      --panel: #fff;
      --soft: #f8fafc;
      --accent: #165dff;
      --accent-2: #0f766e;
      --danger: #b42318;
      --shadow: 0 10px 30px rgba(19, 32, 51, .08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    a { color: inherit; }
    header {
      position: sticky;
      top: 0;
      z-index: 2;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, .94);
      backdrop-filter: blur(14px);
    }
    .shell { width: min(1180px, calc(100% - 32px)); margin: 0 auto; }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 72px;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; }
    .mark {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border-radius: 7px;
      background: var(--accent);
      color: #fff;
      letter-spacing: 0;
    }
    .brand small, .muted, p { color: var(--muted); }
    main { padding: 24px 0 56px; }
    h1, h2, p { margin: 0; }
    h1 { font-size: 28px; line-height: 1.25; letter-spacing: 0; }
    .hero { display: grid; gap: 14px; margin-bottom: 14px; }
    .hero-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
    }
    .hero-copy { display: grid; gap: 6px; }
    .quick-links { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
    .quick-links button {
      width: auto;
      height: 32px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      color: var(--accent);
      font-weight: 700;
      white-space: nowrap;
    }
    .stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
    .stat, .panel, .result, .detail-panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }
    .stat { padding: 14px; min-width: 0; }
    .stat span { display: block; color: var(--muted); font-size: 13px; }
    .stat strong { font-size: 23px; letter-spacing: 0; }
    .panel { padding: 14px; margin-bottom: 14px; }
    .plan-panel { display: grid; gap: 14px; }
    .plan-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 250px;
      gap: 12px;
      align-items: end;
    }
    .plan-head h2 { margin: 0 0 6px; font-size: 18px; }
    .plan-detail {
      display: grid;
      grid-template-columns: minmax(180px, .55fr) minmax(0, 1.45fr);
      gap: 12px;
      align-items: center;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--soft);
    }
    .plan-detail span { display: block; color: var(--muted); font-size: 13px; }
    .plan-detail strong { font-size: 24px; letter-spacing: 0; }
    .query-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .query-chip {
      max-width: 100%;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      color: var(--ink);
      font-size: 13px;
      overflow-wrap: anywhere;
    }
    .controls {
      display: grid;
      grid-template-columns: minmax(230px, 1fr) 170px 170px 150px 150px 110px;
      gap: 10px;
    }
    input, select, button {
      width: 100%;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      padding: 0 12px;
    }
    button {
      cursor: pointer;
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
      font-weight: 700;
    }
    button:disabled { cursor: not-allowed; opacity: .45; }
    .meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 14px 0;
      color: var(--muted);
      font-size: 14px;
    }
    .results { display: grid; gap: 10px; }
    .result {
      padding: 14px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
    }
    .result h2 { margin: 0 0 6px; font-size: 18px; letter-spacing: 0; }
    .result p { line-height: 1.5; overflow-wrap: anywhere; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .tag {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 8px;
      color: var(--muted);
      font-size: 12px;
      background: var(--soft);
    }
    .tag.ksic { color: #075985; border-color: #bae6fd; background: #f0f9ff; }
    .links { display: flex; flex-direction: column; gap: 8px; min-width: 132px; }
    a.btn, button.link-btn {
      display: block;
      width: 100%;
      min-height: 38px;
      border: 1px solid var(--accent);
      border-radius: 7px;
      padding: 9px 10px;
      background: var(--accent);
      color: #fff;
      text-align: center;
      text-decoration: none;
      font-weight: 700;
    }
    a.btn.secondary { color: var(--accent); background: #fff; }
    button.link-btn { border-color: var(--accent-2); background: var(--accent-2); }
    .pager { display: flex; justify-content: center; gap: 8px; margin-top: 18px; }
    .pager button { width: auto; min-width: 92px; }
    .empty { padding: 28px; text-align: center; color: var(--muted); }
    .error { color: var(--danger); }
    .detail-overlay {
      position: fixed;
      inset: 0;
      z-index: 5;
      overflow: auto;
      padding: 28px 16px;
      background: rgba(19, 32, 51, .48);
    }
    .detail-overlay[hidden] { display: none; }
    .detail-panel {
      width: min(820px, 100%);
      margin: 0 auto;
      box-shadow: 0 24px 70px rgba(16, 24, 40, .24);
    }
    .detail-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      padding: 18px;
      border-bottom: 1px solid var(--line);
    }
    .detail-head h2 { margin: 0 0 6px; font-size: 22px; letter-spacing: 0; }
    .detail-close {
      width: 42px;
      min-width: 42px;
      padding: 0;
      border-color: var(--line);
      background: #fff;
      color: var(--ink);
      font-size: 24px;
    }
    .detail-body { display: grid; gap: 14px; padding: 18px; }
    .detail-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .detail-item { border: 1px solid var(--line); border-radius: 8px; padding: 12px; background: #fbfcfe; }
    .detail-item span { display: block; margin-bottom: 5px; color: var(--muted); font-size: 12px; }
    .detail-item strong, .detail-item a, .source-box { overflow-wrap: anywhere; }
    .detail-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .detail-actions a {
      border: 1px solid var(--accent);
      border-radius: 7px;
      padding: 9px 10px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
    }
    .detail-actions a.secondary { background: #fff; color: var(--accent); }
    .source-box { white-space: pre-wrap; color: var(--muted); }
    @media (max-width: 980px) {
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .controls { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 720px) {
      .hero-head, .top, .meta { align-items: flex-start; flex-direction: column; }
      .quick-links { justify-content: flex-start; }
      .stats, .controls, .result, .detail-grid, .plan-head, .plan-detail { grid-template-columns: 1fr; }
      .links { flex-direction: row; flex-wrap: wrap; }
      h1 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="shell top">
      <div class="brand"><div class="mark">IL</div><div>Industry Lead<br><small>lead.industry.ai.kr</small></div></div>
      <p id="generated"></p>
    </div>
  </header>

  <main class="shell">
    <section class="hero">
      <div class="hero-head">
        <div class="hero-copy">
          <h1>산업별 B2B 리드 검색</h1>
          <p>홈페이지가 확인된 전국 사업자 데이터를 산업, KSIC 대분류, 지역, 연락 채널로 검색합니다.</p>
        </div>
        <div class="quick-links" id="quickLinks"></div>
      </div>
      <div class="stats">
        <div class="stat"><span>전체 리드</span><strong id="totalCount">-</strong></div>
        <div class="stat"><span>검색 결과</span><strong id="resultCount">-</strong></div>
        <div class="stat"><span>산업군</span><strong id="industryCount">-</strong></div>
        <div class="stat"><span>KSIC 분류</span><strong id="ksicCount">-</strong></div>
        <div class="stat"><span>지역</span><strong id="regionCount">-</strong></div>
      </div>
    </section>

    <section class="panel plan-panel">
      <div class="plan-head">
        <div>
          <h2>산업별 탐색 기준</h2>
          <p>19개 KSIC 대분류를 기준으로 실제 세일즈 탐색에 쓸 검색어와 현재 확보량을 함께 봅니다.</p>
        </div>
        <select id="planIndustry" aria-label="산업 탐색 기준 선택"></select>
      </div>
      <div class="plan-detail">
        <div><span id="planCode">KSIC</span><strong id="planCount">-</strong></div>
        <p id="planNote"></p>
      </div>
      <div class="query-list" id="planQueries"></div>
    </section>

    <section class="panel">
      <div class="controls">
        <input id="q" type="search" placeholder="회사명, 주소, 홈페이지, 제품, 부스 검색" autocomplete="off">
        <select id="ksic"><option value="">전체 KSIC</option></select>
        <select id="industry"><option value="">전체 산업</option></select>
        <select id="region"><option value="">전체 지역</option></select>
        <select id="contactFilter">
          <option value="">연락 채널 전체</option>
          <option value="phone">전화 있음</option>
          <option value="email">이메일 있음</option>
          <option value="homepage">홈페이지 있음</option>
        </select>
        <button id="reset">초기화</button>
      </div>
    </section>

    <div class="meta"><span id="status">데이터 로딩 중</span><span>페이지당 24개</span></div>
    <section id="results" class="results"></section>
    <div class="pager"><button id="prev">이전</button><button id="next">다음</button></div>
  </main>

  <div id="detailOverlay" class="detail-overlay" hidden>
    <article class="detail-panel" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
      <div class="detail-head">
        <div>
          <h2 id="detailTitle"></h2>
          <p id="detailSubtitle"></p>
        </div>
        <button id="detailClose" class="detail-close" type="button" aria-label="닫기">×</button>
      </div>
      <div class="detail-body">
        <div class="detail-actions" id="detailActions"></div>
        <div class="detail-grid" id="detailGrid"></div>
        <div class="detail-item">
          <span>출처</span>
          <strong id="detailSource" class="source-box"></strong>
        </div>
      </div>
    </article>
  </div>

  <script>
    const pageSize = 24;
    let all = [];
    let filtered = [];
    let page = 1;
    let summary = {};
    const el = id => document.getElementById(id);
    const fmt = n => Number(n || 0).toLocaleString("ko-KR");
    const norm = v => String(v || "").toLowerCase().replace(/\s+/g, " ").trim();
    const quickIndustries = [
      "식품·푸드테크",
      "전기·전력·에너지",
      "배터리·에너지",
      "스마트팩토리·자동화",
      "의료·헬스케어",
      "바이오·제약·연구장비",
      "뷰티·화장품",
      "포장·패키징",
      "물류·콜드체인",
      "화학·소재",
      "금속·기계·소재",
      "제조업",
      "정보통신업",
      "전문서비스",
      "건축사사무소"
    ];
    const ksicPlan = [
      ["A", "농업, 임업 및 어업", "농업법인, 축산, 가공식품, 스마트팜, 생산자 조직"],
      ["B", "광업", "광산, 골재, 석재, 원자재 개발"],
      ["C", "제조업", "공장, 산업단지, 부품, 장비, 소재, OEM, 조달 제조사"],
      ["D", "전기, 가스, 증기 및 공기조절 공급업", "발전, 전력기술, 재생에너지, 에너지 설비"],
      ["E", "수도, 하수 및 폐기물 처리, 원료 재생업", "폐기물, 환경플랜트, 수처리, 재활용"],
      ["F", "건설업", "종합건설, 전문건설, 설비, 전기, 통신, 인테리어"],
      ["G", "도매 및 소매업", "도매, 유통, 총판, 대리점, 장비 판매"],
      ["H", "운수 및 창고업", "화물운송, 포워딩, 물류창고, 냉장, 냉동, 배송"],
      ["I", "숙박 및 음식점업", "외식, 카페, 숙박, 관광숙박, 프랜차이즈"],
      ["J", "정보통신업", "소프트웨어, SI, 플랫폼, 데이터, 게임, 콘텐츠, 통신"],
      ["K", "금융 및 보험업", "금융사, 보험대리점, 자산운용, 투자, 대부"],
      ["L", "부동산업", "중개, 개발, 주택관리, 임대, 자산관리"],
      ["M", "전문, 과학 및 기술 서비스업", "법무, 세무, 회계, 특허, 설계, 엔지니어링, 컨설팅"],
      ["N", "사업시설 관리, 사업 지원 및 임대 서비스업", "인력공급, 경비, 청소, 시설관리, 콜센터, 렌탈"],
      ["O", "공공 행정, 국방 및 사회보장 행정", "공공기관, 지방공기업, 지자체, 행정기관"],
      ["P", "교육 서비스업", "학원, 교습소, 어린이집, 대학, 직업훈련기관"],
      ["Q", "보건업 및 사회복지 서비스업", "병원, 의원, 약국, 요양기관, 복지시설"],
      ["R", "예술, 스포츠 및 여가관련 서비스업", "공연, 체육시설, 관광, 여가, 게임, 오락시설"],
      ["S", "협회 및 단체, 수리 및 기타 개인 서비스업", "협회, 단체, 조합, 수리, 생활서비스"]
    ];
    const ksicNames = Object.fromEntries(ksicPlan.map(([code, name]) => [code, name]));
    const planQuerySuffixes = ["업체 홈페이지", "회사 문의", "전시 참가기업", "업체 명단", "협회 회원사"];

    function option(select, value, label = value) {
      const node = document.createElement("option");
      node.value = value;
      node.textContent = label;
      select.appendChild(node);
    }
    function escapeHtml(value) {
      return String(value || "").replace(/[&<>'"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", "\"": "&quot;" }[c]));
    }
    function tag(value, className = "") {
      return `<span class="tag ${className}">${escapeHtml(value)}</span>`;
    }
    function ksicLabel(item) {
      const code = item.ksic_major_code || "";
      if (!code) return "";
      return `${code} · ${item.ksic_major_name || summary.ksic_major_names?.[code] || ksicNames[code] || "KSIC"}`;
    }
    function renderPlan() {
      const selected = ksicPlan.find(item => item[0] === el("planIndustry").value) || ksicPlan[0];
      const [code, name, note] = selected;
      const count = summary.ksic_major_counts?.[code] || 0;
      el("planCode").textContent = `${code} · ${summary.ksic_major_names?.[code] || name}`;
      el("planCount").textContent = `${fmt(count)}개`;
      el("planNote").textContent = note;
      el("planQueries").innerHTML = planQuerySuffixes
        .map(suffix => `<span class="query-chip">${escapeHtml(`${name} ${suffix}`)}</span>`)
        .join("");
    }
    function initPlan() {
      el("planIndustry").innerHTML = "";
      ksicPlan.forEach(([code, name]) => option(el("planIndustry"), code, `${code} · ${summary.ksic_major_names?.[code] || name}`));
      renderPlan();
    }
    function passesContactFilter(item, filter) {
      if (filter === "phone") return Boolean(item.phone);
      if (filter === "email") return Boolean(item.email);
      if (filter === "homepage") return Boolean(item.homepage);
      return true;
    }
    function apply() {
      const q = norm(el("q").value);
      const ksic = el("ksic").value;
      const industry = el("industry").value;
      const region = el("region").value;
      const contactFilter = el("contactFilter").value;
      filtered = all.filter(item => {
        if (ksic && item.ksic_major_code !== ksic) return false;
        if (industry && item.industry !== industry) return false;
        if (region && item.region !== region) return false;
        if (!passesContactFilter(item, contactFilter)) return false;
        if (!q) return true;
        return norm([
          item.name,
          item.industry,
          item.field,
          item.segment,
          item.product,
          item.certification_number,
          item.representative,
          item.ceo,
          item.stock_code,
          item.ksic_major_code,
          item.ksic_major_name,
          item.region,
          item.address,
          item.homepage,
          item.phone,
          item.email,
          item.booth,
          item.business_type,
          item.industry_type,
          item.source,
          item.source_page
        ].join(" ")).includes(q);
      });
      page = 1;
      render();
    }
    function render() {
      const start = (page - 1) * pageSize;
      const items = filtered.slice(start, start + pageSize);
      el("resultCount").textContent = fmt(filtered.length);
      el("status").textContent = filtered.length
        ? `${fmt(filtered.length)}개 중 ${fmt(start + 1)}-${fmt(Math.min(start + items.length, filtered.length))} 표시`
        : "검색 결과 없음";
      const results = el("results");
      results.innerHTML = "";
      if (!items.length) {
        results.innerHTML = '<div class="empty panel">검색 결과가 없습니다.</div>';
        el("prev").disabled = true;
        el("next").disabled = true;
        return;
      }
      for (const item of items) {
        const card = document.createElement("article");
        card.className = "result";
        const homepage = item.homepage ? `<a class="btn" href="${escapeHtml(item.homepage)}" target="_blank" rel="noopener">홈페이지</a>` : "";
        const contact = item.contact ? `<a class="btn secondary" href="${escapeHtml(item.contact)}" target="_blank" rel="noopener">문의 페이지</a>` : "";
        const ksic = ksicLabel(item);
        card.innerHTML = `
          <div>
            <h2>${escapeHtml(item.name)}</h2>
            <p>${escapeHtml(item.address || "주소 정보 없음")}</p>
            <div class="tags">
              ${ksic ? tag(ksic, "ksic") : ""}
              ${tag(item.industry || "산업 미분류")}
              ${item.field ? tag(item.field) : ""}
              ${tag(item.region || "전국")}
              ${item.booth ? tag(`부스 ${item.booth}`) : ""}
              ${item.phone ? tag(item.phone) : ""}
              ${item.email ? tag(item.email) : ""}
            </div>
          </div>
          <div class="links">
            <button class="link-btn" type="button" data-detail-id="${escapeHtml(item.id)}">상세보기</button>
            ${homepage}
            ${contact}
          </div>`;
        results.appendChild(card);
        card.querySelector("[data-detail-id]").addEventListener("click", () => showDetail(item.id));
      }
      el("prev").disabled = page <= 1;
      el("next").disabled = start + pageSize >= filtered.length;
    }
    function detailItem(label, value, href) {
      const hasValue = value !== undefined && value !== null && String(value).trim() !== "";
      const safeValue = escapeHtml(hasValue ? value : "정보 없음");
      const content = href && hasValue ? `<a href="${escapeHtml(href)}" target="_blank" rel="noopener">${safeValue}</a>` : `<strong>${safeValue}</strong>`;
      return `<div class="detail-item"><span>${escapeHtml(label)}</span>${content}</div>`;
    }
    function optionalDetailItem(label, value, href) {
      return value ? detailItem(label, value, href) : "";
    }
    function showDetail(id) {
      const item = all.find(candidate => String(candidate.id) === String(id));
      if (!item) return;
      const ksic = ksicLabel(item);
      el("detailTitle").textContent = item.name;
      el("detailSubtitle").textContent = [item.industry || "산업 미분류", ksic || "", item.region || "전국"].filter(Boolean).join(" · ");
      el("detailActions").innerHTML = [
        item.homepage ? `<a href="${escapeHtml(item.homepage)}" target="_blank" rel="noopener">홈페이지 열기</a>` : "",
        item.contact ? `<a class="secondary" href="${escapeHtml(item.contact)}" target="_blank" rel="noopener">문의 페이지</a>` : "",
        item.email ? `<a class="secondary" href="mailto:${escapeHtml(item.email)}">이메일</a>` : ""
      ].filter(Boolean).join("");
      el("detailGrid").innerHTML = [
        detailItem("KSIC", ksic),
        detailItem("산업", item.industry),
        detailItem("분야", item.field),
        optionalDetailItem("구분", item.segment),
        optionalDetailItem("주요제품", item.product),
        detailItem("지역", item.region),
        detailItem("주소", item.address),
        optionalDetailItem("부스", item.booth),
        optionalDetailItem("전화", item.phone),
        optionalDetailItem("이메일", item.email, item.email ? `mailto:${item.email}` : ""),
        detailItem("홈페이지", item.homepage, item.homepage),
        optionalDetailItem("문의 페이지", item.contact, item.contact),
        optionalDetailItem("대표자", item.representative || item.ceo),
        optionalDetailItem("사업유형", item.business_type),
        optionalDetailItem("세부분류", item.industry_type),
        optionalDetailItem("인증번호", item.certification_number),
        optionalDetailItem("종목코드", item.stock_code),
        optionalDetailItem("원천 페이지", item.source_page, item.source_page)
      ].join("");
      el("detailSource").textContent = item.source || "정보 없음";
      el("detailOverlay").hidden = false;
      if (location.hash !== `#lead-${item.id}`) history.replaceState(null, "", `#lead-${item.id}`);
    }
    function closeDetail() {
      el("detailOverlay").hidden = true;
      if (location.hash.startsWith("#lead-")) history.replaceState(null, "", location.pathname + location.search);
    }
    function openHashDetail() {
      const match = location.hash.match(/^#lead-(\d+)$/);
      if (match) showDetail(match[1]);
    }
    async function loadData() {
      const manifest = await fetch("data-index.json", { cache: "no-store" })
        .then(r => r.ok ? r.json() : Promise.reject(new Error("manifest unavailable")))
        .catch(() => fetch("data.json", { cache: "no-store" }).then(r => r.json()));
      const chunks = manifest.chunks || [];
      if (!chunks.length) return manifest;
      el("status").textContent = "데이터 불러오는 중";
      const chunkPayloads = await Promise.all(chunks.map(chunk =>
        fetch(chunk.url, { cache: "no-store" }).then(r => {
          if (!r.ok) throw new Error(`failed to load ${chunk.url}`);
          return r.json();
        })
      ));
      return {
        ...manifest,
        items: chunkPayloads.flatMap(chunk => chunk.items || [])
      };
    }
    function initialize(payload) {
      all = payload.items || [];
      filtered = all.slice();
      summary = payload.summary || {};
      const ksicCodes = summary.ksic_major_codes || [...new Set(all.map(item => item.ksic_major_code).filter(Boolean))].sort();
      el("totalCount").textContent = fmt(summary.total || all.length);
      el("regionCount").textContent = fmt((summary.regions || []).length);
      el("industryCount").textContent = fmt((summary.industries || []).length);
      el("ksicCount").textContent = fmt(ksicCodes.length);
      el("generated").textContent = summary.generated ? `updated ${summary.generated}` : "";
      ksicCodes.forEach(code => option(el("ksic"), code, `${code} · ${summary.ksic_major_names?.[code] || ksicNames[code] || "KSIC"}`));
      (summary.industries || []).forEach(v => option(el("industry"), v));
      (summary.regions || []).forEach(v => option(el("region"), v));
      quickIndustries.filter(v => (summary.industries || []).includes(v)).forEach(value => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = value;
        button.addEventListener("click", () => { el("industry").value = value; apply(); });
        el("quickLinks").appendChild(button);
      });
      initPlan();
      render();
      openHashDetail();
    }
    loadData().then(initialize).catch(error => {
      console.error(error);
      el("status").innerHTML = '<span class="error">데이터를 불러오지 못했습니다.</span>';
      el("results").innerHTML = '<div class="empty panel">데이터를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.</div>';
    });
    el("q").addEventListener("input", apply);
    el("ksic").addEventListener("change", apply);
    el("industry").addEventListener("change", apply);
    el("region").addEventListener("change", apply);
    el("contactFilter").addEventListener("change", apply);
    el("planIndustry").addEventListener("change", renderPlan);
    el("reset").addEventListener("click", () => {
      el("q").value = "";
      el("ksic").value = "";
      el("industry").value = "";
      el("region").value = "";
      el("contactFilter").value = "";
      apply();
    });
    el("prev").addEventListener("click", () => { if (page > 1) { page--; render(); scrollTo(0, 0); } });
    el("next").addEventListener("click", () => { if (page * pageSize < filtered.length) { page++; render(); scrollTo(0, 0); } });
    el("detailClose").addEventListener("click", closeDetail);
    el("detailOverlay").addEventListener("click", event => { if (event.target === el("detailOverlay")) closeDetail(); });
    addEventListener("keydown", event => { if (event.key === "Escape" && !el("detailOverlay").hidden) closeDetail(); });
    addEventListener("hashchange", openHashDetail);
  </script>
</body>
</html>
