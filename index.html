<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Industry Lead Search</title>
  <meta name="description" content="산업별 B2B 리드 검색 데이터베이스">
  <style>
    :root {
      color-scheme: light;
      --ink: #132033;
      --muted: #637083;
      --line: #d7dee8;
      --bg: #f5f7fb;
      --panel: #fff;
      --soft: #f8fafc;
      --accent: #165dff;
      --accent-2: #0f766e;
      --shadow: 0 10px 30px rgba(19, 32, 51, .08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    a { color: inherit; }
    header {
      position: sticky;
      top: 0;
      z-index: 2;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, .94);
      backdrop-filter: blur(14px);
    }
    .shell { width: min(1180px, calc(100% - 32px)); margin: 0 auto; }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 72px;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; }
    .mark {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border-radius: 7px;
      background: var(--accent);
      color: #fff;
    }
    .brand small, .muted, p { color: var(--muted); }
    main { padding: 28px 0 56px; }
    h1, h2, p { margin: 0; }
    h1 { font-size: 29px; line-height: 1.25; }
    .hero { display: grid; gap: 18px; margin-bottom: 18px; }
    .hero-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
    }
    .quick-links { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
    .quick-links button {
      width: auto;
      height: 32px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      color: var(--accent);
      font-weight: 700;
    }
    .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    .stat, .panel, .result, .detail-panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }
    .stat { padding: 14px; }
    .stat span { display: block; color: var(--muted); font-size: 13px; }
    .stat strong { font-size: 24px; }
    .panel { padding: 14px; margin-bottom: 14px; }
    .controls { display: grid; grid-template-columns: minmax(240px, 1fr) 180px 170px 160px 120px; gap: 10px; }
    input, select, button {
      width: 100%;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      padding: 0 12px;
    }
    button {
      cursor: pointer;
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
      font-weight: 700;
    }
    .meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 14px 0;
      color: var(--muted);
      font-size: 14px;
    }
    .results { display: grid; gap: 10px; }
    .result { padding: 14px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; }
    .result h2 { margin: 0 0 6px; font-size: 18px; }
    .result p { line-height: 1.5; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .tag {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 8px;
      color: var(--muted);
      font-size: 12px;
      background: var(--soft);
    }
    .links { display: flex; flex-direction: column; gap: 8px; min-width: 132px; }
    a.btn, button.link-btn {
      display: block;
      width: 100%;
      min-height: 38px;
      border: 1px solid var(--accent);
      border-radius: 7px;
      padding: 9px 10px;
      background: var(--accent);
      color: #fff;
      text-align: center;
      text-decoration: none;
      font-weight: 700;
    }
    a.btn.secondary { color: var(--accent); background: #fff; }
    button.link-btn { border-color: var(--accent-2); background: var(--accent-2); }
    .pager { display: flex; justify-content: center; gap: 8px; margin-top: 18px; }
    .pager button { width: auto; min-width: 92px; }
    .empty { padding: 28px; text-align: center; color: var(--muted); }
    .detail-overlay {
      position: fixed;
      inset: 0;
      z-index: 5;
      overflow: auto;
      padding: 28px 16px;
      background: rgba(19, 32, 51, .48);
    }
    .detail-overlay[hidden] { display: none; }
    .detail-panel {
      width: min(820px, 100%);
      margin: 0 auto;
      box-shadow: 0 24px 70px rgba(16, 24, 40, .24);
    }
    .detail-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      padding: 18px;
      border-bottom: 1px solid var(--line);
    }
    .detail-head h2 { margin: 0 0 6px; font-size: 22px; }
    .detail-close {
      width: 42px;
      min-width: 42px;
      padding: 0;
      border-color: var(--line);
      background: #fff;
      color: var(--ink);
    }
    .detail-body { display: grid; gap: 14px; padding: 18px; }
    .detail-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .detail-item { border: 1px solid var(--line); border-radius: 8px; padding: 12px; background: #fbfcfe; }
    .detail-item span { display: block; margin-bottom: 5px; color: var(--muted); font-size: 12px; }
    .detail-item strong, .detail-item a, .source-box { overflow-wrap: anywhere; }
    .detail-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .detail-actions a {
      border: 1px solid var(--accent);
      border-radius: 7px;
      padding: 9px 10px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
    }
    .detail-actions a.secondary { background: #fff; color: var(--accent); }
    .source-box { white-space: pre-wrap; color: var(--muted); }
    @media (max-width: 860px) {
      .hero-head, .top, .meta { align-items: flex-start; flex-direction: column; }
      .quick-links { justify-content: flex-start; }
      .stats, .controls, .result, .detail-grid { grid-template-columns: 1fr; }
      .links { flex-direction: row; flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <header>
    <div class="shell top">
      <div class="brand"><div class="mark">IL</div><div>Industry Lead<br><small>lead.industry.ai.kr</small></div></div>
      <p id="generated"></p>
    </div>
  </header>
  <main class="shell">
    <section class="hero">
      <div class="hero-head">
        <div>
          <h1>산업별 세일즈 리드 검색</h1>
          <p>법무, 노무, 감정평가, 자산운용, 환경, 승강기, 소방, 건축 리드를 한 번에 필터링합니다.</p>
        </div>
        <div class="quick-links" id="quickLinks"></div>
      </div>
      <div class="stats">
        <div class="stat"><span>전체 리드</span><strong id="totalCount">-</strong></div>
        <div class="stat"><span>검색 결과</span><strong id="resultCount">-</strong></div>
        <div class="stat"><span>산업군</span><strong id="industryCount">-</strong></div>
        <div class="stat"><span>지역</span><strong id="regionCount">-</strong></div>
      </div>
    </section>

    <section class="panel">
      <div class="controls">
        <input id="q" type="search" placeholder="회사명, 주소, 홈페이지, 이메일 검색" autocomplete="off">
        <select id="industry"><option value="">전체 산업</option></select>
        <select id="region"><option value="">전체 지역</option></select>
        <select id="contactFilter">
          <option value="">연락 채널 전체</option>
          <option value="phone">전화 있음</option>
          <option value="email">이메일 있음</option>
          <option value="homepage">홈페이지 있음</option>
        </select>
        <button id="reset">초기화</button>
      </div>
    </section>

    <div class="meta"><span id="status">데이터 로딩 중</span><span>페이지당 24개</span></div>
    <section id="results" class="results"></section>
    <div class="pager"><button id="prev">이전</button><button id="next">다음</button></div>
  </main>

  <div id="detailOverlay" class="detail-overlay" hidden>
    <article class="detail-panel" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
      <div class="detail-head">
        <div>
          <h2 id="detailTitle"></h2>
          <p id="detailSubtitle"></p>
        </div>
        <button id="detailClose" class="detail-close" type="button" aria-label="닫기">×</button>
      </div>
      <div class="detail-body">
        <div class="detail-actions" id="detailActions"></div>
        <div class="detail-grid" id="detailGrid"></div>
        <div class="detail-item">
          <span>출처</span>
          <strong id="detailSource" class="source-box"></strong>
        </div>
      </div>
    </article>
  </div>

  <script>
    const pageSize = 24;
    let all = [];
    let filtered = [];
    let page = 1;
    const el = id => document.getElementById(id);
    const fmt = n => Number(n || 0).toLocaleString("ko-KR");
    const norm = v => String(v || "").toLowerCase().replace(/\s+/g, " ").trim();
    const quickIndustries = ["법무법인", "노무법인", "감정평가법인", "관세법인", "자산운용사", "환경측정업", "승강기유지관리업", "소방시설업"];

    function option(select, value) {
      const node = document.createElement("option");
      node.value = value;
      node.textContent = value;
      select.appendChild(node);
    }
    function escapeHtml(value) {
      return String(value || "").replace(/[&<>'"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", "\"": "&quot;" }[c]));
    }
    function tag(value) {
      return `<span class="tag">${escapeHtml(value)}</span>`;
    }
    function passesContactFilter(item, filter) {
      if (filter === "phone") return Boolean(item.phone);
      if (filter === "email") return Boolean(item.email);
      if (filter === "homepage") return Boolean(item.homepage);
      return true;
    }
    function apply() {
      const q = norm(el("q").value);
      const industry = el("industry").value;
      const region = el("region").value;
      const contactFilter = el("contactFilter").value;
      filtered = all.filter(item => {
        if (industry && item.industry !== industry) return false;
        if (region && item.region !== region) return false;
        if (!passesContactFilter(item, contactFilter)) return false;
        if (!q) return true;
        return norm([item.name, item.industry, item.field, item.region, item.address, item.homepage, item.phone, item.email, item.source].join(" ")).includes(q);
      });
      page = 1;
      render();
    }
    function render() {
      const start = (page - 1) * pageSize;
      const items = filtered.slice(start, start + pageSize);
      el("resultCount").textContent = fmt(filtered.length);
      el("status").textContent = filtered.length
        ? `${fmt(filtered.length)}개 중 ${fmt(start + 1)}-${fmt(Math.min(start + items.length, filtered.length))} 표시`
        : "검색 결과 없음";
      const results = el("results");
      results.innerHTML = "";
      if (!items.length) {
        results.innerHTML = '<div class="empty panel">검색 결과가 없습니다.</div>';
        return;
      }
      for (const item of items) {
        const card = document.createElement("article");
        card.className = "result";
        const homepage = item.homepage ? `<a class="btn" href="${escapeHtml(item.homepage)}" target="_blank" rel="noopener">홈페이지</a>` : "";
        const contact = item.contact ? `<a class="btn secondary" href="${escapeHtml(item.contact)}" target="_blank" rel="noopener">문의 페이지</a>` : "";
        card.innerHTML = `
          <div>
            <h2>${escapeHtml(item.name)}</h2>
            <p>${escapeHtml(item.address || "주소 정보 없음")}</p>
            <div class="tags">
              ${tag(item.industry || "산업 미분류")}
              ${item.field ? tag(item.field) : ""}
              ${tag(item.region || "전국")}
              ${item.phone ? tag(item.phone) : ""}
              ${item.email ? tag(item.email) : ""}
            </div>
          </div>
          <div class="links">
            <button class="link-btn" type="button" data-detail-id="${item.id}">상세보기</button>
            ${homepage}
            ${contact}
          </div>`;
        results.appendChild(card);
        card.querySelector("[data-detail-id]").addEventListener("click", () => showDetail(item.id));
      }
      el("prev").disabled = page <= 1;
      el("next").disabled = start + pageSize >= filtered.length;
    }
    function detailItem(label, value, href) {
      const safeValue = escapeHtml(value || "정보 없음");
      const content = href ? `<a href="${escapeHtml(href)}" target="_blank" rel="noopener">${safeValue}</a>` : `<strong>${safeValue}</strong>`;
      return `<div class="detail-item"><span>${escapeHtml(label)}</span>${content}</div>`;
    }
    function showDetail(id) {
      const item = all.find(candidate => String(candidate.id) === String(id));
      if (!item) return;
      el("detailTitle").textContent = item.name;
      el("detailSubtitle").textContent = [item.industry || "산업 미분류", item.region || "전국"].join(" · ");
      el("detailActions").innerHTML = [
        item.homepage ? `<a href="${escapeHtml(item.homepage)}" target="_blank" rel="noopener">홈페이지 열기</a>` : "",
        item.contact ? `<a class="secondary" href="${escapeHtml(item.contact)}" target="_blank" rel="noopener">문의 페이지</a>` : "",
        item.email ? `<a class="secondary" href="mailto:${escapeHtml(item.email)}">이메일</a>` : ""
      ].filter(Boolean).join("");
      el("detailGrid").innerHTML = [
        detailItem("산업", item.industry),
        detailItem("분야", item.field),
        detailItem("지역", item.region),
        detailItem("주소", item.address),
        detailItem("전화", item.phone),
        detailItem("이메일", item.email, item.email ? `mailto:${item.email}` : ""),
        detailItem("홈페이지", item.homepage, item.homepage),
        detailItem("문의 페이지", item.contact, item.contact)
      ].join("");
      el("detailSource").textContent = item.source || "정보 없음";
      el("detailOverlay").hidden = false;
      if (location.hash !== `#lead-${item.id}`) history.replaceState(null, "", `#lead-${item.id}`);
    }
    function closeDetail() {
      el("detailOverlay").hidden = true;
      if (location.hash.startsWith("#lead-")) history.replaceState(null, "", location.pathname + location.search);
    }
    function openHashDetail() {
      const match = location.hash.match(/^#lead-(\d+)$/);
      if (match) showDetail(match[1]);
    }
    fetch("data.json").then(r => r.json()).then(payload => {
      all = payload.items || [];
      filtered = all.slice();
      el("totalCount").textContent = fmt(payload.summary.total);
      el("regionCount").textContent = fmt(payload.summary.regions.length);
      el("industryCount").textContent = fmt(payload.summary.industries.length);
      el("generated").textContent = `updated ${payload.summary.generated}`;
      payload.summary.industries.forEach(v => option(el("industry"), v));
      payload.summary.regions.forEach(v => option(el("region"), v));
      quickIndustries.filter(v => payload.summary.industries.includes(v)).forEach(value => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = value;
        button.addEventListener("click", () => { el("industry").value = value; apply(); });
        el("quickLinks").appendChild(button);
      });
      render();
      openHashDetail();
    });
    el("q").addEventListener("input", apply);
    el("industry").addEventListener("change", apply);
    el("region").addEventListener("change", apply);
    el("contactFilter").addEventListener("change", apply);
    el("reset").addEventListener("click", () => {
      el("q").value = "";
      el("industry").value = "";
      el("region").value = "";
      el("contactFilter").value = "";
      apply();
    });
    el("prev").addEventListener("click", () => { if (page > 1) { page--; render(); scrollTo(0, 0); } });
    el("next").addEventListener("click", () => { if (page * pageSize < filtered.length) { page++; render(); scrollTo(0, 0); } });
    el("detailClose").addEventListener("click", closeDetail);
    el("detailOverlay").addEventListener("click", event => { if (event.target === el("detailOverlay")) closeDetail(); });
    addEventListener("keydown", event => { if (event.key === "Escape" && !el("detailOverlay").hidden) closeDetail(); });
    addEventListener("hashchange", openHashDetail);
  </script>
</body>
</html>
